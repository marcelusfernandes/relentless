name: ci

on:
  push:
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook, decision, and git-hook tests
        run: |
          bash tests/hooks/test-hooks.sh
          bash tests/hooks/test-decide-guard.sh
          bash tests/hooks/test-githooks.sh
          bash tests/scripts/test-wait-ci.sh
          bash tests/scripts/test-review-verdict.sh
          python3 tests/agents/test-codex-agent-briefs.py
          bash tests/scripts/test-bootstrap-upgrade.sh
          bash tests/scripts/test-portability.sh
          bash tests/scripts/test-fill-qa-multiline.sh
          bash tests/scripts/test-github-templates-yaml.sh
          bash tests/scripts/test-merge-mode.sh
          bash tests/scripts/test-bootstrap-additive.sh

      # M1, M5, and M10 are the core. M3 stays non-blocking until the layer
      # files and disabled-layer hooks land (PR 3).
      - name: Acceptance M1 M5 M10
        run: |
          bash tests/scripts/test-m1-bootstrap-leaves-consumer.sh
          bash tests/scripts/test-m5-repo-wins.sh
          bash tests/scripts/test-m10-issue-develop.sh

      - name: Acceptance M3 (layers, non-blocking until PR 3)
        continue-on-error: true
        run: bash tests/scripts/test-m3-layers-off.sh

  # Every pull request. The image is Alpine with bash 3.2; do not apk add bash.
  bash32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: All suites under bash 3.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -i \
            -e GH_TOKEN \
            -e GITHUB_TOKEN \
            -v "$PWD:/work" \
            -w /work \
            bash:3.2 \
            sh -s <<'BASH32'
          set -eu
          bash --version | grep -q 'version 3.2'
          # ruby loads the GitHub template YAML. github-cli is the gh the bootstrap suite calls.
          # Do not add the bash package: that would replace the image bash 3.2.
          apk add --no-cache jq git python3 ruby github-cli
          bash --version | grep -q 'version 3.2'
          git config --global --add safe.directory /work
          bash tests/hooks/test-hooks.sh
          bash tests/hooks/test-decide-guard.sh
          bash tests/hooks/test-githooks.sh
          bash tests/scripts/test-wait-ci.sh
          bash tests/scripts/test-review-verdict.sh
          python3 tests/agents/test-codex-agent-briefs.py
          bash tests/scripts/test-bootstrap-upgrade.sh
          bash tests/scripts/test-portability.sh
          bash tests/scripts/test-fill-qa-multiline.sh
          bash tests/scripts/test-github-templates-yaml.sh
          bash tests/scripts/test-merge-mode.sh
          bash tests/scripts/test-bootstrap-additive.sh
          BASH32

      - name: Acceptance M1 M5 M10 under bash 3.2
        run: |
          docker run --rm -i \
            -v "$PWD:/work" \
            -w /work \
            bash:3.2 \
            sh -s <<'BASH32'
          set -eu
          apk add --no-cache jq git
          bash --version | grep -q 'version 3.2'
          git config --global --add safe.directory /work
          bash tests/scripts/test-m1-bootstrap-leaves-consumer.sh
          bash tests/scripts/test-m5-repo-wins.sh
          bash tests/scripts/test-m10-issue-develop.sh
          BASH32

      - name: Acceptance M3 under bash 3.2 (layers, non-blocking until PR 3)
        continue-on-error: true
        run: |
          docker run --rm -i \
            -v "$PWD:/work" \
            -w /work \
            bash:3.2 \
            sh -s <<'BASH32'
          set -u
          apk add --no-cache jq git
          bash --version | grep -q 'version 3.2'
          git config --global --add safe.directory /work
          bash tests/scripts/test-m3-layers-off.sh
          BASH32

  # Stock macOS bash and BSD tools. Release PRs only; macos-latest is billed apart from Linux.
  macos-release:
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'release') || startsWith(github.event.pull_request.title, 'release:'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: All suites on /bin/bash
        run: |
          /bin/bash tests/hooks/test-hooks.sh
          /bin/bash tests/hooks/test-decide-guard.sh
          /bin/bash tests/hooks/test-githooks.sh
          /bin/bash tests/scripts/test-wait-ci.sh
          /bin/bash tests/scripts/test-review-verdict.sh
          python3 tests/agents/test-codex-agent-briefs.py
          /bin/bash tests/scripts/test-bootstrap-upgrade.sh
          /bin/bash tests/scripts/test-portability.sh
          /bin/bash tests/scripts/test-fill-qa-multiline.sh
          /bin/bash tests/scripts/test-github-templates-yaml.sh
          /bin/bash tests/scripts/test-merge-mode.sh
          /bin/bash tests/scripts/test-bootstrap-additive.sh

      - name: Acceptance M1 M5 M10 on /bin/bash
        run: |
          /bin/bash tests/scripts/test-m1-bootstrap-leaves-consumer.sh
          /bin/bash tests/scripts/test-m5-repo-wins.sh
          /bin/bash tests/scripts/test-m10-issue-develop.sh

      - name: Acceptance M3 on /bin/bash (layers, non-blocking until PR 3)
        continue-on-error: true
        run: /bin/bash tests/scripts/test-m3-layers-off.sh
